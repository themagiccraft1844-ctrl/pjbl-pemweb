<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Wishnotes</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Background gradasi pastel yang imut */
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Kartu Login */
        .login-card {
            background-color: #ffffff;
            border-radius: 25px; /* Sudut sangat bulat */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: none;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            position: relative;
        }

        /* Hiasan lingkaran background di dalam kartu (dekorasi) */
        .login-card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: #fbc2eb;
            border-radius: 50%;
            opacity: 0.3;
        }

        .brand-icon {
            font-size: 60px;
            color: #a18cd1;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        h2 {
            font-weight: 700;
            color: #4a4a4a;
        }

        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Input Form Custom */
        .form-control {
            border-radius: 50px; /* Bentuk kapsul */
            padding: 12px 20px;
            border: 2px solid #eee;
            background-color: #f9f9f9;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #a18cd1;
            box-shadow: 0 0 0 4px rgba(161, 140, 209, 0.1);
        }

        /* Tombol Login */
        .btn-wish {
            background: linear-gradient(to right, #a18cd1, #fbc2eb);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            color: white;
            width: 100%;
            transition: transform 0.2s;
        }

        .btn-wish:hover {
            transform: translateY(-3px); /* Efek naik sedikit saat hover */
            box-shadow: 0 5px 15px rgba(161, 140, 209, 0.4);
            color: white;
        }

        /* Tautan */
        .link-text {
            color: #a18cd1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .link-text:hover {
            color: #8a6dc5;
            text-decoration: underline;
        }

        /* Toggle Password Eye */
        .input-group-text {
            background: transparent;
            border: none;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            z-index: 10;
        }
        
        .input-group {
            position: relative;
        }

        /* Animasi Mengambang untuk Ikon */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card text-center">
            
            <div class="brand-icon">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            
            <h2>Halo!</h2>
            <p class="subtitle">Siap mengirim harapan hari ini?</p>

            <form id="loginForm">
                <div class="mb-3 text-start">
                    <input type="email" class="form-control" id="email" placeholder="Email Kamu..." required>
                </div>

                <div class="mb-4 text-start">
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Kata Sandi..." required>
                        <span class="input-group-text" id="togglePassword">
                            <i class="fa-regular fa-eye-slash"></i>
                        </span>
                    </div>
                </div>

                <button type="submit" class="btn btn-wish mb-3" id="btnLogin">
                    Mulai Masuk
                </button>

                <div class="d-flex justify-content-between mt-3">
                    <a href="#" class="link-text text-muted" style="font-size: 0.8rem;">Lupa Password?</a>
                    <a href="#" class="link-text">Buat Akun Baru</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            
            // 1. Logic Show/Hide Password
            $('#togglePassword').click(function() {
                let passwordInput = $('#password');
                let icon = $(this).find('i');

                if (passwordInput.attr('type') === 'password') {
                    passwordInput.attr('type', 'text');
                    icon.removeClass('fa-eye-slash').addClass('fa-eye');
                    icon.css('color', '#a18cd1');
                } else {
                    passwordInput.attr('type', 'password');
                    icon.removeClass('fa-eye').addClass('fa-eye-slash');
                    icon.css('color', '#aaa');
                }
            });

            // 2. Logic Fake Login Loading
            $('#loginForm').submit(function(e) {
                e.preventDefault(); // Mencegah form reload halaman langsung
                
                let btn = $('#btnLogin');
                let originalText = btn.html();

                // Ubah tombol jadi loading
                btn.prop('disabled', true);
                btn.html('<i class="fas fa-spinner fa-spin"></i> Tunggu sebentar...');

                // Simulasi delay 1.5 detik seolah-olah sedang cek database
                setTimeout(function() {
                    window.location.href = "dashboard.html"; // Redirect ke dashboard dummy
                }, 1500);
            });

        });
    </script>

</body>
</html>
